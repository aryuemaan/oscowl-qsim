[project]
name = "oscowl-qsim-backend"
version = "0.1.0"
description = "OSCOWL Q-Sim: tensor-network quantum simulation with AI-assisted debugging"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 130
